<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hielo DIBEN - Registro de Empleados</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0077b6;
            --secondary: #00b4d8;
            --dark: #023e8a;
            --light: #caf0f8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--light) 0%, var(--secondary) 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .btn-regresar {
            position: fixed;
            top: 25px; left: 25px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            color: var(--dark); width: 45px; height: 45px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            text-decoration: none; font-size: 22px; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 119, 182, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5); z-index: 1000;
            transition: all 0.3s ease;
        }
        .btn-regresar:hover { background: #ffffff; color: var(--primary); transform: scale(1.1); }
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px; padding: 40px; text-align: center;
            box-shadow: 0 15px 35px rgba(0, 119, 182, 0.2);
            width: 100%; max-width: 420px; z-index: 10;
        }
        .logo-img { max-width: 200px; margin-bottom: 15px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12)); }
        h2 { color: var(--dark); font-size: 20px; font-weight: 800; text-transform: uppercase; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; margin-bottom: 15px; }
        label { font-size: 14px; font-weight: 700; color: var(--dark); }
        input, select {
            padding: 12px 15px; font-size: 15px; font-family: 'Montserrat', sans-serif;
            background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 12px; outline: none; color: #333; width: 100%;
        }
        input:focus, select:focus { background: #ffffff; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 119, 182, 0.15); }
        .btn-registrar {
            width: 100%; padding: 14px; background: var(--primary); border: none; color: white;
            font-size: 16px; font-weight: 700; font-family: 'Montserrat', sans-serif;
            text-transform: uppercase; border-radius: 50px; cursor: pointer; margin-top: 10px;
            box-shadow: 0 5px 15px rgba(0, 119, 182, 0.3); transition: all 0.3s ease;
        }
        .btn-registrar:hover { background: #ffffff; color: var(--primary); transform: translateY(-2px); }
        .link-login { display: block; margin-top: 15px; color: var(--dark); font-weight: 700; text-decoration: none; font-size: 14px; }
        .link-login:hover { text-decoration: underline; color: var(--primary); }

        /* Estilos para los Modales Estéticos (Glassmorphism) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 35px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 119, 182, 0.3);
            text-align: center;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-icon-exito {
            width: 75px;
            height: 75px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }

        .modal-card h3 {
            color: var(--dark);
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .modal-card p {
            color: #333;
            font-size: 14px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .btn-modal-primario {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            border: none;
            color: white;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 119, 182, 0.3);
            transition: all 0.3s ease;
        }

        .btn-modal-primario:hover {
            background: var(--dark);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <a href="login-empleado.html" class="btn-regresar">←</a>

    <div class="glass-card">
        <img src="IMG_1420.PNG" alt="Hielo DIBEN" class="logo-img">
        <h2>Registro de Empleado</h2>
        <form id="formRegistroEmpleado">
            <div class="form-group">
                <label>Número de Empleado:</label>
                <input type="text" id="numeroEmpleado" required placeholder="Ej. EMP001" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Turno:</label>
                <select id="turno" required>
                    <option value="">Seleccione el turno</option>
                    <option value="TM">Turno Matutino (TM)</option>
                    <option value="TD">Turno Vespertino (TD)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Nombre y Apellido:</label>
                <input type="text" id="nombreCompleto" required placeholder="Ej. Juan Pérez" autocomplete="off">
            </div>
            <button type="submit" class="btn-registrar">Registrarse</button>
        </form>
        <a href="login-empleado.html" class="link-login">¿Ya estás registrado? Inicia sesión</a>
    </div>

    <!-- Modal de Éxito Personalizado -->
    <div id="modalExito" class="modal-overlay">
        <div class="modal-card">
            <img src="IMG_guardar_Recu.png" alt="Guardado con éxito" class="modal-icon-exito">
            <h3>¡Registro Exitoso!</h3>
            <p id="modalMensajeTexto">¡Empleado registrado con éxito! Ahora puedes iniciar sesión.</p>
            <button type="button" class="btn-modal-primario" onclick="cerrarModalExito()">Aceptar</button>
        </div>
    </div>

    <!-- Modal de Alerta/Error Personalizado -->
    <div id="modalAlerta" class="modal-overlay">
        <div class="modal-card">
            <h3 style="color: #e63946;">¡Atención!</h3>
            <p id="textoAlerta">Mensaje de aviso.</p>
            <button type="button" class="btn-modal-primario" onclick="cerrarAlerta()">Aceptar</button>
        </div>
    </div>

    <script>
        function mostrarModalExito(mensaje, callback) {
            document.getElementById('modalMensajeTexto').innerText = mensaje;
            document.getElementById('modalExito').style.display = 'flex';
            window.modalCallback = callback;
        }

        function cerrarModalExito() {
            document.getElementById('modalExito').style.display = 'none';
            if (typeof window.modalCallback === 'function') {
                window.modalCallback();
            }
        }

        function mostrarAlerta(mensaje) {
            document.getElementById('textoAlerta').innerText = mensaje;
            document.getElementById('modalAlerta').style.display = 'flex';
        }

        function cerrarAlerta() {
            document.getElementById('modalAlerta').style.display = 'none';
        }

        document.getElementById('formRegistroEmpleado').addEventListener('submit', async function(e) {
            e.preventDefault();
            const numeroEmpleado = document.getElementById('numeroEmpleado').value.trim();
            const turno = document.getElementById('turno').value;
            const nombreCompleto = document.getElementById('nombreCompleto').value.trim();

            try {
                const res = await fetch('/api/empleados/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ numeroEmpleado, turno, nombreCompleto })
                });

                if (res.ok) {
                    mostrarModalExito('¡Empleado registrado con éxito! Ahora puedes iniciar sesión.', function() {
                        window.location.href = 'login-empleado.html';
                    });
                } else {
                    const errorMsg = await res.text();
                    mostrarAlerta(errorMsg);
                }
            } catch (err) {
                console.error(err);
                mostrarAlerta('Error de conexión con el servidor.');
            }
        });
    </script>
</body>
</html>
