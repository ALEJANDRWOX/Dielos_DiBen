<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hielo DIBEN - Administrador</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue-deep: #14529a;
            --blue-main: #0b6bb8;
            --blue-mid: #1f8fd0;
            --cyan: #38c6e6;
            --cyan-soft: #a9e6f5;
            --ice: #e6f8fd;
            --text-dark: #0a3d7a;
            --error: #c62828;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px 24px 40px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(115deg, var(--blue-deep) 0%, var(--blue-mid) 38%, #5ad2ec 75%, var(--cyan-soft) 100%);
        }

        /* Círculos decorativos */
        .circle { position: absolute; border-radius: 50%; z-index: 1; pointer-events: none; }
        .circle-1 { width: 480px; height: 480px; top: -170px; left: -130px; background: rgba(255,255,255,0.08); }
        .circle-2 { width: 360px; height: 360px; bottom: -140px; left: 12%; background: rgba(255,255,255,0.07); }
        .circle-3 { width: 420px; height: 420px; top: -120px; right: 6%; background: rgba(255,255,255,0.18); }
        .circle-4 { width: 340px; height: 340px; bottom: -110px; right: -80px; background: rgba(255,255,255,0.22); }

        /* Encabezado */
        .header {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 30px;
            z-index: 1000;
        }

        .logo-img {
            height: 62px;
            width: auto;
            border-radius: 14px;
            filter: drop-shadow(0 4px 10px rgba(2, 40, 100, 0.35));
        }

        .btn-regresar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 6px 18px rgba(2, 40, 100, 0.25);
            transition: all 0.3s ease;
        }
        .btn-regresar:hover {
            background: #ffffff;
            color: var(--blue-main);
            transform: translateX(-3px);
        }

        /* Tarjeta de cristal */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 0 40px 38px;
            text-align: center;
            border-radius: 32px;
            background: linear-gradient(160deg, rgba(255,255,255,0.62) 0%, rgba(205,242,252,0.45) 100%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 25px 60px rgba(4, 50, 120, 0.35),
                        inset 0 1px 0 rgba(255,255,255,0.8);
            animation: aparecer 0.7s ease both;
            margin-top: 40px;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .icon-badge {
            width: 104px; height: 104px;
            margin: -52px auto 0;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(145deg, #ffffff, var(--ice));
            border: 4px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 28px rgba(4, 50, 120, 0.3);
        }
        .icon-badge img {
            width: 62px; height: 62px;
            object-fit: contain;
        }

        h1 {
            margin-top: 20px;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--blue-main);
        }

        .subtitulo {
            margin-top: 6px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
            opacity: 0.8;
        }

        .divisor {
            width: 54px; height: 4px;
            margin: 18px auto 26px;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--blue-main), var(--cyan));
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
            text-align: left;
        }

        .form-group { display: flex; flex-direction: column; gap: 7px; }

        label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-dark);
        }

        .input-wrap { position: relative; }

        input {
            width: 100%;
            padding: 14px 18px;
            font-size: 15px;
            font-family: 'Montserrat', sans-serif;
            color: #1b2a41;
            background: rgba(255, 255, 255, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.95);
            border-radius: 14px;
            outline: none;
            box-shadow: 0 3px 10px rgba(11, 107, 184, 0.08);
            transition: all 0.3s ease;
        }
        input::placeholder { color: #7a93ad; }
        input:focus {
            background: #ffffff;
            border-color: var(--blue-mid);
            box-shadow: 0 0 0 4px rgba(31, 143, 208, 0.2);
        }

        #clave { padding-right: 50px; }

        .toggle-pass {
            position: absolute;
            right: 8px; top: 50%;
            transform: translateY(-50%);
            width: 36px; height: 36px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--blue-main);
            font-size: 17px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .toggle-pass:hover { background: rgba(11, 107, 184, 0.12); }

        .mensaje-error {
            display: none;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            color: var(--error);
            background: rgba(255, 235, 235, 0.9);
            border: 1px solid rgba(198, 40, 40, 0.25);
            animation: sacudir 0.35s ease;
        }
        .mensaje-error.visible { display: block; }

        @keyframes sacudir {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .btn-acceder {
            width: 100%;
            padding: 15px;
            margin-top: 4px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffffff;
            background: linear-gradient(90deg, var(--blue-deep), var(--blue-mid));
            box-shadow: 0 8px 20px rgba(11, 107, 184, 0.4);
            transition: all 0.3s ease;
        }
        .btn-acceder:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px rgba(11, 107, 184, 0.5);
            filter: brightness(1.08);
        }
        .btn-acceder:active { transform: translateY(0); }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-dark);
            opacity: 0.65;
        }

        @media (max-width: 520px) {
            .header { padding: 14px 18px; }
            .logo-img { height: 52px; }
            .glass-card { padding: 0 24px 30px; border-radius: 26px; }
            h1 { font-size: 21px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="IMG_logo_Recur.ico" alt="Hielo DIBEN" class="logo-img">
        <a href="roles.html" class="btn-regresar">← REGRESAR</a>
    </div>

    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
    <div class="circle circle-4"></div>

    <main class="glass-card">
        <div class="icon-badge">
            <img src="IMG_Llave_Recu.png" alt="Llave Administrador">
        </div>

        <h1>Administrador</h1>
        <p class="subtitulo">Ingresa tus credenciales para continuar</p>
        <div class="divisor"></div>

        <form id="formLoginAdmin">
            <div class="form-group">
                <label for="usuario">USUARIO</label>
                <div class="input-wrap">
                    <input type="text" id="usuario" required placeholder="Ingrese usuario" autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label for="clave">CLAVE</label>
                <div class="input-wrap">
                    <input type="password" id="clave" required placeholder="Ingrese contraseña">
                    <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar u ocultar contraseña">👁</button>
                </div>
            </div>

            <div class="mensaje-error" id="mensajeError">Usuario o contraseña incorrectos.</div>

            <button type="submit" class="btn-acceder">Acceder</button>
        </form>

        <p class="footer">© 2026 Erlands. Todos los derechos reservados.</p>
    </main>

<script>
    const campoClave = document.getElementById('clave');
    const mensajeError = document.getElementById('mensajeError');

    document.getElementById('togglePass').addEventListener('click', function () {
        campoClave.type = campoClave.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('formLoginAdmin').addEventListener('submit', async function(e) {
        e.preventDefault();
        const usuario = document.getElementById('usuario').value.trim();
        const clave = campoClave.value.trim();

        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, clave })
            });

            if (res.ok) {
                window.location.href = 'admin-dashboard.html';
            } else {
                // Leemos la respuesta como texto para soportar tanto JSON como texto plano (ej. el bloqueo por intentos)
                const textoRespuesta = await res.text();
                let mensaje = 'Usuario o contraseña incorrectos.';

                try {
                    const data = JSON.parse(textoRespuesta);
                    mensaje = data.error || mensaje;
                } catch {
                    if (textoRespuesta) mensaje = textoRespuesta;
                }

                mensajeError.textContent = mensaje;
                mensajeError.classList.remove('visible');
                void mensajeError.offsetWidth;
                mensajeError.classList.add('visible');
            }
        } catch (err) {
            console.error(err);
            mensajeError.textContent = 'Error de conexión con el servidor.';
            mensajeError.classList.remove('visible');
            void mensajeError.offsetWidth;
            mensajeError.classList.add('visible');
        }
    });
</script>
</body>
</html>
