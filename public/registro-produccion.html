<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hielo DIBEN - Registro de Producción</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0077b6;
            --secondary: #00b4d8;
            --dark: #023e8a;
            --light: #caf0f8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--light) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 30px 20px;
            overflow-x: hidden;
        }

        /* Botón de Regreso Flotante Minimalista */
        .btn-regresar {
            position: fixed;
            top: 25px;
            left: 25px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            color: var(--dark);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 119, 182, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .btn-regresar:hover {
            background: #ffffff;
            color: var(--primary);
            transform: scale(1.1);
        }

        /* Círculos decorativos de fondo */
        .circle-1, .circle-2 {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            z-index: 1;
            pointer-events: none;
        }
        .circle-1 {
            width: 450px;
            height: 450px;
            top: -150px;
            left: -100px;
        }
        .circle-2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            right: -50px;
        }

        /* Tarjeta principal con efecto Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 35px 45px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 119, 182, 0.2);
            z-index: 10;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo-container {
            margin-bottom: 5px;
        }

        .logo-img {
            max-width: 200px;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.12));
        }

        .titulo-formulario {
            color: var(--dark);
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }

        label {
            font-size: 14px;
            font-weight: 700;
            color: var(--dark);
        }

        input {
            padding: 12px 15px;
            font-size: 16px;
            font-family: 'Montserrat', sans-serif;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            outline: none;
            color: #333;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        input:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 119, 182, 0.15);
        }

        .btn-guardar {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 119, 182, 0.3);
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .btn-guardar:hover {
            background: #ffffff;
            color: var(--primary);
            box-shadow: 0 8px 22px rgba(0, 119, 182, 0.4);
            transform: translateY(-2px);
        }

        .btn-guardar:active {
            transform: translateY(0);
        }

        /* Estilos para los Modales Estéticos (Glassmorphism) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 35px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 119, 182, 0.3);
            text-align: center;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-icon-exito {
            width: 75px;
            height: 75px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }

        .modal-card h3 {
            color: var(--dark);
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .modal-card p {
            color: #333;
            font-size: 14px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .modal-botones {
            display: flex;
            gap: 10px;
        }

        .btn-modal-primario {
            flex: 1;
            padding: 12px;
            background: var(--primary);
            border: none;
            color: white;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 119, 182, 0.3);
            transition: all 0.3s ease;
        }

        .btn-modal-primario:hover {
            background: var(--dark);
            transform: translateY(-2px);
        }

        .btn-modal-secundario {
            flex: 1;
            padding: 12px;
            background: #e63946;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
            transition: all 0.3s ease;
        }

        .btn-modal-secundario:hover {
            background: #d90429;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Botón de regreso minimalista flotante -->
    <a href="contenedores.html" class="btn-regresar" id="btnRegresar">←</a>

    <div class="circle-1"></div>
    <div class="circle-2"></div>

    <div class="glass-card">
        <div class="logo-container">
            <img src="IMG_1420.PNG" alt="Hielo DIBEN" class="logo-img">
        </div>

        <!-- Título dinámico que cambiará según el contenedor elegido -->
        <div class="titulo-formulario" id="titulo-contenedor">Contenedor: --</div>

        <div class="form-group">
            <label>Fecha:</label>
            <input type="date" id="input-fecha" required>
        </div>

        <div class="form-group">
            <label>Hora:</label>
            <input type="time" id="input-hora" required>
        </div>

        <!-- Campo: Hielos extraídos -->
        <div class="form-group">
            <label>Hielos extraídos:</label>
            <input type="number" id="input-hielos" value="0" min="0" required>
        </div>

        <div class="form-group">
            <label>Mermas (Cantidad de errores):</label>
            <input type="number" id="input-mermas" value="0" min="0" required>
        </div>

        <button class="btn-guardar" onclick="guardarProduccion()">Guardar Registro</button>
    </div>

    <!-- Modal de Éxito Personalizado -->
    <div id="modalExito" class="modal-overlay">
        <div class="modal-card">
            <img src="IMG_guardar_Recu.png" alt="Guardado con éxito" class="modal-icon-exito">
            <h3>¡Guardado Exitosamente!</h3>
            <p id="modalMensajeTexto">El registro se ha guardado correctamente en la base de datos.</p>
            <button type="button" class="btn-modal-primario" onclick="cerrarModalExito()">Aceptar</button>
        </div>
    </div>

    <!-- Modal de Alerta/Error Personalizado -->
    <div id="modalAlerta" class="modal-overlay">
        <div class="modal-card">
            <h3 style="color: #e63946;">¡Atención!</h3>
            <p id="textoAlerta">Mensaje de aviso.</p>
            <button type="button" class="btn-modal-primario" onclick="cerrarAlerta()">Aceptar</button>
        </div>
    </div>

    <!-- Modal de Confirmación de Salida Personalizado -->
    <div id="modalConfirmar" class="modal-overlay">
        <div class="modal-card">
            <h3>¿Estás seguro?</h3>
            <p id="textoConfirmar">¿Estás seguro que quieres dejar el formulario sin terminar? Por lo consecuente no se guardarán los datos.</p>
            <div class="modal-botones">
                <button type="button" class="btn-modal-secundario" onclick="ejecutarConfirmar(false)">Cancelar</button>
                <button type="button" class="btn-modal-primario" onclick="ejecutarConfirmar(true)">Sí, salir</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Leer qué contenedor seleccionamos desde la URL
        const parametrosURL = new URLSearchParams(window.location.search);
        const contenedorSeleccionado = parametrosURL.get('contenedor');

        // Mostrarlo en el título
        if (contenedorSeleccionado) {
            document.getElementById('titulo-contenedor').innerText = `Contenedor: ${contenedorSeleccionado}`;
        } else {
            mostrarAlerta("No se seleccionó ningún contenedor. Regresa a la pantalla anterior.");
        }

        // 2. Autocompletar la fecha y hora con el momento exacto actual
        const ahora = new Date();
        
        // Formatear Fecha (YYYY-MM-DD)
        const anio = ahora.getFullYear();
        const mes = String(ahora.getMonth() + 1).padStart(2, '0');
        const dia = String(ahora.getDate()).padStart(2, '0');
        document.getElementById('input-fecha').value = `${anio}-${mes}-${dia}`;

        // Formatear Hora (HH:MM)
        const horas = String(ahora.getHours()).padStart(2, '0');
        const minutos = String(ahora.getMinutes()).padStart(2, '0');
        document.getElementById('input-hora').value = `${horas}:${minutos}`;

        // Control de cambios en el formulario para la advertencia de salida
        let formularioModificado = false;
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                formularioModificado = true;
            });
        });

        // Interceptar botón de regreso con modal estético en lugar de confirm() nativo
        document.getElementById('btnRegresar').addEventListener('click', function(e) {
            if (formularioModificado) {
                e.preventDefault();
                mostrarConfirmacion(
                    "¿Estás seguro que quieres dejar el formulario sin terminar? Por lo consecuente no se guardarán los datos.",
                    function(confirmado) {
                        if (confirmado) {
                            window.location.href = 'contenedores.html';
                        }
                    }
                );
            }
        });

        // Funciones para controlar los modales estéticos
        function mostrarAlerta(mensaje) {
            document.getElementById('textoAlerta').innerText = mensaje;
            document.getElementById('modalAlerta').style.display = 'flex';
        }

        function cerrarAlerta() {
            document.getElementById('modalAlerta').style.display = 'none';
        }

        let callbackConfirmacion = null;
        function mostrarConfirmacion(mensaje, callback) {
            document.getElementById('textoConfirmar').innerText = mensaje;
            document.getElementById('modalConfirmar').style.display = 'flex';
            callbackConfirmacion = callback;
        }

        function ejecutarConfirmar(resultado) {
            document.getElementById('modalConfirmar').style.display = 'none';
            if (callbackConfirmacion) {
                callbackConfirmacion(resultado);
                callbackConfirmacion = null;
            }
        }

        function mostrarModalExito(mensaje, callback) {
            document.getElementById('modalMensajeTexto').innerText = mensaje;
            document.getElementById('modalExito').style.display = 'flex';
            window.modalCallback = callback;
        }

        function cerrarModalExito() {
            document.getElementById('modalExito').style.display = 'none';
            if (typeof window.modalCallback === 'function') {
                window.modalCallback();
            }
        }

        // 3. Función que se ejecuta al darle al botón Guardar
        async function guardarProduccion() {
            const hielosExtraidos = parseInt(document.getElementById('input-hielos').value) || 0;
            const mermas = parseInt(document.getElementById('input-mermas').value) || 0;

            // Validación: Las mermas deben ser menores o iguales a los hielos extraídos
            if (mermas > hielosExtraidos) {
                mostrarAlerta("Error: La cantidad de mermas no puede ser mayor a los hielos extraídos.");
                return;
            }

            // Recuperar empleado de localStorage
            const empleadoGuardado = JSON.parse(localStorage.getItem('empleadoActual')) || {};

            const fecha = document.getElementById('input-fecha').value;
            const hora = document.getElementById('input-hora').value;

            const datosParaEnviar = {
                codigoContenedor: contenedorSeleccionado,
                fecha: fecha,
                hora: hora,
                hielosExtraidos: hielosExtraidos,
                mermas: mermas,
                empleadoNum: empleadoGuardado.numero_empleado || 'N/A',
                empleadoNombre: empleadoGuardado.nombre_completo || 'Desconocido'
            };

            try {
                // Enviamos los datos al servidor (fetch)
                const respuesta = await fetch('/api/produccion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosParaEnviar)
                });

                if (respuesta.ok) {
                    formularioModificado = false; // Desactivar advertencia si ya se guardó correctamente
                    mostrarModalExito(`¡Éxito! Registro guardado en la base de datos.\nContenedor: ${contenedorSeleccionado}`, function() {
                        window.location.href = 'contenedores.html'; // Regresa al menú
                    });
                } else {
                    mostrarAlerta("Hubo un error al guardar en la base de datos.");
                }
            } catch (error) {
                console.error("Error de conexión:", error);
                mostrarAlerta("No hay conexión con el servidor principal.");
            }
        }
    </script>
</body>
</html>
